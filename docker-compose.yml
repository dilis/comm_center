# Variables come from .env (see .env.example); the defaults below suit local development only.
services:
  db:
    image: mysql:8.4
    # Lets the non-SUPER app user create the immutability trigger (migration 0001) while the
    # binary log is on. Any other MySQL server that runs the migrations needs the same setting.
    command: ["--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-comm_center}
      MYSQL_USER: ${MYSQL_USER:-comm_center}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-comm_center}
    ports:
      - "${DB_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - db_data:/var/lib/mysql

  # api and web carry their own HEALTHCHECK (see their Dockerfiles).
  api:
    profiles: ["app"]
    build: ./apps/api
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-comm_center}:${MYSQL_PASSWORD:-comm_center}@db:3306/${MYSQL_DATABASE:-comm_center}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-dev-only-secret}
      # Derives each Android phone's webhook signing key (`app.cli webhook-info`).
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-dev-only-webhook-secret-change-me-dev-only}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Believe the web container's X-Forwarded-For, so login rate limiting sees each visitor's
      # address rather than nginx's. Safe only while nothing untrusted can reach the API port
      # directly: see "Login rate limiting" in docs/DEPLOYMENT.md.
      FORWARDED_ALLOW_IPS: "*"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  # One-shot setup for the worker: makes sure the device `${WORKER_DEVICE:-fake}` exists, with
  # WORKER_SECRET as the secret its worker signs in with (as the device's agent `gsm-<name>`), so a
  # fresh stack can send out of the box. It needs the database, so it runs from the API image after
  # the API has migrated it, and exits when done.
  worker-setup:
    profiles: ["app", "worker"]
    build: ./apps/api
    command: ["/opt/venv/bin/python", "-m", "app.cli", "ensure-device", "--name", "${WORKER_DEVICE:-fake}", "--phone", "${WORKER_DEVICE_PHONE:-+639170000000}"]
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-comm_center}:${MYSQL_PASSWORD:-comm_center}@db:3306/${MYSQL_DATABASE:-comm_center}
      WORKER_SECRET: ${WORKER_SECRET:-dev-only-worker-secret-change-me}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
        required: false  # waits for the API (it runs the migrations) when that profile is on

  # The worker holds the devices (serial ports, phones), so it is a process of its own, never part
  # of the API. It has NO database access: it signs in to the API as its device's agent and serves
  # that device. It starts with the rest of the stack (profile `app`); `--profile worker` starts it
  # alone, against an API elsewhere (set WORKER_API_URL). The `fake` provider (WORKER_PROVIDER, the
  # worker's own choice: the API does not know) only LOGS sends instead of transmitting them (and
  # marks them sent): do not use it where real messages matter. Append a JSON line to /tmp/fake-inbox.jsonl in this
  # container to "receive" an SMS (see docs/DEPLOYMENT.md). A modem also needs its serial device
  # passed through (`devices: ["/dev/ttyUSB0:/dev/ttyUSB0"]`) once the hardware is available.
  worker:
    profiles: ["app", "worker"]
    build: ./apps/worker  # its own image: no database driver, no API code
    command: ["/opt/venv/bin/python", "-m", "comm_center_worker", "--fake-inbox", "/tmp/fake-inbox.jsonl"]
    environment:
      WORKER_API_URL: ${WORKER_API_URL:-http://api:8000}
      WORKER_NAME: gsm-${WORKER_DEVICE:-fake}
      WORKER_SECRET: ${WORKER_SECRET:-dev-only-worker-secret-change-me}
      WORKER_PROVIDER: ${WORKER_PROVIDER:-fake}
      # Least seconds between sends (carriers may throttle bulk SMS); 0 = no spacing.
      WORKER_SEND_INTERVAL_SECONDS: ${WORKER_SEND_INTERVAL_SECONDS:-0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WORKER_HEARTBEAT_FILE: /tmp/worker.heartbeat
      # How long the fake modem takes per message (seconds): the delay plus up to the jitter.
      WORKER_FAKE_SEND_DELAY_SECONDS: ${WORKER_FAKE_SEND_DELAY_SECONDS:-2}
      WORKER_FAKE_SEND_JITTER_SECONDS: ${WORKER_FAKE_SEND_JITTER_SECONDS:-1}
    healthcheck:
      # Healthy while the API keeps answering the worker's sessions (it touches the heartbeat file
      # only then), so a worker that cannot reach the API reads as unhealthy.
      test: ["CMD", "/opt/venv/bin/python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/tmp/worker.heartbeat')<60 else 1)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      worker-setup:
        condition: service_completed_successfully

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db_data:
