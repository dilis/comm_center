# Variables come from .env (see .env.example); the defaults below suit local development only.
services:
  db:
    image: mysql:8.4
    # Lets the non-SUPER app user create the immutability trigger (migration 0001) while the
    # binary log is on. Any other MySQL server that runs the migrations needs the same setting.
    command: ["--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-comm_center}
      MYSQL_USER: ${MYSQL_USER:-comm_center}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-comm_center}
    ports:
      - "${DB_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - db_data:/var/lib/mysql

  # api and web carry their own HEALTHCHECK (see their Dockerfiles).
  api:
    profiles: ["app"]
    build: ./apps/api
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-comm_center}:${MYSQL_PASSWORD:-comm_center}@db:3306/${MYSQL_DATABASE:-comm_center}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-dev-only-secret}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  # The GSM worker owns the serial ports, so it is a process of its own, never part of the API.
  # Profile `worker`: start it with `docker compose --profile app --profile worker up -d --wait`.
  # Only the fake provider exists so far: it LOGS sends instead of transmitting them, so do not
  # run it where real messages matter. The real modem provider also needs the serial device
  # passed through (`devices: ["/dev/ttyUSB0:/dev/ttyUSB0"]`) once the hardware is available.
  worker:
    profiles: ["worker"]
    build: ./apps/api
    command: ["/opt/venv/bin/python", "-m", "app.worker", "--provider", "fake"]
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-comm_center}:${MYSQL_PASSWORD:-comm_center}@db:3306/${MYSQL_DATABASE:-comm_center}
      WORKER_HEARTBEAT_FILE: /tmp/worker.heartbeat
    healthcheck:
      # Healthy while the loops keep touching the heartbeat file (the API runs the migrations).
      test: ["CMD", "/opt/venv/bin/python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/tmp/worker.heartbeat')<60 else 1)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
        required: false  # waits for the API (it runs the migrations) when that profile is on

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db_data:
