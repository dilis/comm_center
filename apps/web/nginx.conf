# Template: the nginx image fills in ${API_UPSTREAM} at start (see apps/web/Dockerfile).
server {
  listen 80;
  root /usr/share/nginx/html;

  # Strict CSP: the token lives in script-readable storage and SMS text is untrusted, so only our
  # own scripts may run and nothing may talk to another origin. style-src needs 'unsafe-inline'
  # because the dialog library injects a <style> element; scripts stay strict.
  add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;

  # The browser calls /api/...; the prefix is dropped on the way to the API.
  location /api/ {
    proxy_pass http://${API_UPSTREAM}/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri /index.html;
  }
}
